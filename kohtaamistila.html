<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kohtaamistila</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <img src="kuvake.png" alt="EtäKohtaamon logo" class="logo">
    <h1>Virtuaalinen kahvitauko</h1>
</header>

<main>

    <section class="messages">
        <h2>Viestit</h2>
        <div class="msg">
            <strong>Aino 14:02</strong>
            <p>Moi! Ihana nähdä muita. Aloitin juuri gradun kirjoittamisen.</p>
        </div>

        <div class="msg">
            <strong>Matias 14:04</strong>
            <p>Moi Aino! Sama juttu koodausprojektin kanssa.</p>
        </div>
    </section>

    <form>
        <label for="viesti">Kirjoita viesti:</label>
        <input id="viesti" type="text" placeholder="Kirjoita viesti..." aria-label="Kirjoita viesti">
    </form>

    <a class="button" href="index.html">Poistu tilasta</a>

</main>

</body>
</html>
